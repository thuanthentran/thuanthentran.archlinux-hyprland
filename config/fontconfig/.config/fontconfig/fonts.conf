<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Windows-like (ClearType-style) text on a ~141 DPI panel at scale 1.0:
  subpixel antialiasing (RGB) + slight hinting, instead of the default grayscale,
  which leaves curves and diagonals faint next to vertical stems.
  If letters get coloured fringes, the panel is BGR: change rgb to bgr below.
  GTK4 apps ignore subpixel; they only get the hinting.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Default families. Noto stays as fallback for scripts the main fonts lack (CJK, emoji). -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Lexend</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>IBM Plex Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
