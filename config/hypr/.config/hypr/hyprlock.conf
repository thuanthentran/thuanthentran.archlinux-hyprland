# macOS-like lock screen: blurred wallpaper, clock on top, pill password field.
$font = Lexend

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/default.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = rgba(ffffffdd)
    position = 0, -120
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font Bold
    color = rgba(ffffffee)
    position = 0, -160
    halign = center
    valign = top
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = rgba(ffffffcc)
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = -1
    inner_color = rgba(ffffff22)
    outer_color = rgba(ffffff33)
    check_color = rgba(ffffff66)
    fail_color = rgba(ff5f57cc)
    font_color = rgba(ffffffee)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -100
    halign = center
    valign = center
}
