# Cascadia Code (Nerd Font build: same glyphs plus icons), with ligatures and cursive italic
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# kitty draws text itself (no subpixel). Gamma 1.7 + 30% extra contrast gives thicker,
# Windows-like strokes instead of the thin default on Linux.
text_composition_strategy 1.7 30

window_padding_width 8
confirm_os_window_close 0
