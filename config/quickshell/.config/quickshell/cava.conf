# cava for the bar visualizer (Cava.qml): raw ASCII frames on stdout, one per line,
# bars separated by ';', values 0..100.
[general]
bars = 12
framerate = 30
autosens = 1

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
