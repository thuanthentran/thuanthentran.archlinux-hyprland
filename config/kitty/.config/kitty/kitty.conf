# Cascadia Code (Nerd Font build: same glyphs plus icons), with ligatures and cursive italic
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# kitty draws text itself (no subpixel). Gamma 1.7 + 30% extra contrast gives thicker,
# Windows-like strokes instead of the thin default on Linux.
text_composition_strategy 1.7 30

window_padding_width 8
confirm_os_window_close 0

# Scrolling. Touchpad keeps gliding after the fingers lift (momentum_scroll: friction,
# 0 = off, closer to 1 = longer glide; needs a kitty restart). kitty has no inertia for
# the mouse wheel. Overall speed is also scaled by scroll_factor in hyprland.lua.
momentum_scroll         0.96
touch_scroll_multiplier 1.0
wheel_scroll_multiplier 5.0

# Colours: white + black + green desktop palette (Theme.qml in Quickshell); the 16 ANSI
# colours stay kitty's defaults apart from green
background            #0b0c0b
foreground            #e8eae8
cursor                #4ade80
cursor_text_color     #07130b
selection_background  #2b2e2b
selection_foreground  none
url_color             #4ade80
color2                #3fbf6f
color10               #4ade80
