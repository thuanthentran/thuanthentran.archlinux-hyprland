# The TUF F16 sleeps with s2idle (Modern Standby; /sys/power/mem_sleep). With the NVIDIA
# driver's S0ix support off (its default), the laptop went to sleep but never woke up:
# keyboard lights blinking, no key or power button helped, only a forced power-off.
# Needs nvidia-suspend / nvidia-resume / nvidia-hibernate enabled (setup.sh services).
options nvidia NVreg_EnableS0ixPowerManagement=1
