# Hide ALSA's "Pro Audio" profile. When no HDMI screen is plugged in, the NVIDIA HDMI
# card has no usable normal profile, so WirePlumber fell back to Pro Audio (and remembered
# it), which shows one ghost output per HDMI/DP port ("AD107 ... Pro 7/8/9") and once even
# became the default output. Without it the card shows an HDMI output only when a screen
# with audio is connected.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
