<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Windows-like (ClearType-style) text on a ~141 DPI panel at scale 1.0:
  subpixel antialiasing (RGB) + slight hinting, instead of the default grayscale,
  which leaves curves and diagonals faint next to vertical stems.
  If letters get coloured fringes, the panel is BGR: change rgb to bgr below.
  GTK4 apps ignore subpixel; they only get the hinting.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Default families. Noto stays as fallback for scripts the main fonts lack (CJK, emoji). -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Lexend</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>IBM Plex Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- "The system's UI font" names that apps and web pages ask for (VS Code and its
       extensions, Chrome pages, Electron apps) -> Lexend, with a strong binding so
       Chromium takes it as a real match (without this, Segoe UI became Adwaita Sans).
       Arial / Helvetica / Times New Roman are left to their metric-compatible Liberation
       fonts: pages lay text out for those widths, and Lexend is much wider. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe WPC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lexend</string></edit>
  </match>
</fontconfig>
