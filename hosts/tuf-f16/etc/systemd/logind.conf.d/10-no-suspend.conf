# Suspend to RAM hangs on this laptop (it sleeps but never wakes, in s2idle and deep;
# see CLAUDE.md "Sleep and hibernation"), so nothing may trigger it by itself:
# closing the lid only locks (Hyprland also turns the screen off), the sleep key locks,
# and a short press of the power button is left to Hyprland, which turns the screen back
# on. Shut down from the bar's power menu; holding the button still forces power-off.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
HandleSuspendKey=lock
HandlePowerKey=ignore
